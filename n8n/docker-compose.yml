# n8n (official docker.n8n.io/n8nio/n8n image). Deploy-only, no build of our own.
# Copy .env.example to .env, mkdir -p local-files, then docker compose up -d.

services:
  n8n:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: docker.n8n.io/n8nio/n8n:2.29.8
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # SQLite (default, enough for a single instance) + encryption key.
      - n8n_data:/home/node/.n8n
      # Directory for the "Read/Write Files from Disk" node (N8N_RESTRICT_FILE_ACCESS_TO=/files).
      - ./local-files:/files

volumes:
  n8n_data:
