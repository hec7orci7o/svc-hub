# n8n deployment (official docker.n8n.io/n8nio/n8n image) on lab56.
# Deploy-only: no Dockerfile or build of our own, same as komodo/core.
# Reachable directly by LAN IP:port; public exposure (if any) goes through the
# cloudflared/ tunnel on lab53, not through a reverse proxy in this compose file.
# Copy .env.example to .env and fill it in before:
#   mkdir -p local-files   (create it by hand to get the right owner/permissions)
#   docker compose up -d
# (docker compose loads ./.env automatically, both to interpolate ${VARS}
# here and to inject them into the container via env_file: ./.env)

services:
  n8n:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    # v2.x: major bump from 1.81.0, reviewed manually per the Renovate major-version
    # policy — see the n8n v2.0 breaking-changes note in CLAUDE.md.
    image: docker.n8n.io/n8nio/n8n:2.29.8
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # SQLite (default, enough for a single instance) + encryption key.
      - n8n_data:/home/node/.n8n
      # Directory for the "Read/Write Files from Disk" node (N8N_RESTRICT_FILE_ACCESS_TO=/files).
      - ./local-files:/files

volumes:
  n8n_data:
