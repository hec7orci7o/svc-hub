# AdGuard Home (official adguard/adguardhome image). Deploy-only, no build of our own.
#
# Host prep before first deploy: disable systemd-resolved's stub listener or this can't
# bind host port 53 ("address already in use"):
#   printf '[Resolve]\nDNS=127.0.0.1\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/adguardhome.conf
#   sudo rm -f /etc/resolv.conf && sudo ln -s /run/systemd/resolve/resolv.conf /etc/resolv.conf
#   sudo systemctl reload-or-restart systemd-resolved
#
# No env vars/config file: admin credentials are set once via the setup wizard on :3000 on
# first boot (same trade-off as Odoo's admin_passwd — see CLAUDE.md).

services:
  adguard:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: adguard/adguardhome:v0.107.78
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No HEALTHCHECK: upstream removed theirs in v0.107.34 (caused restart loops), no
    # replacement exists.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  adguard_work:
  adguard_conf:
