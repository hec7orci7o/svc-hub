# AdGuard Home (official adguard/adguardhome image). Deploy-only, no build of our own.
#
# Host prep before first deploy: disable systemd-resolved's stub listener or this can't
# bind host port 53 ("address already in use"):
#   printf '[Resolve]\nDNS=127.0.0.1\nDNSStubListener=no\n' | sudo tee /etc/systemd/resolved.conf.d/adguardhome.conf
#   sudo mv /etc/resolv.conf /etc/resolv.conf.backup && sudo ln -s /run/systemd/resolve/resolv.conf /etc/resolv.conf
#   sudo systemctl reload-or-restart systemd-resolved
# Restart any other already-running container after this — Docker's embedded DNS resolver
# (127.0.0.11) caches the host's resolver address at container start, and disabling the stub
# breaks that cached address (confirmed in production: broke Komodo's own DNS resolution).
#
# No env vars/config file: admin credentials are set once via the setup wizard on :3000 on
# first boot (same trade-off as Odoo's admin_passwd — see CLAUDE.md).

services:
  adguard:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: adguard/adguardhome:v0.107.78
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      # DoH/DoT/DoQ — encrypted DNS for clients that prefer it (e.g. browsers with DoH on
      # by default). Published but inert until a TLS cert is set up in the AdGuard web UI
      # (Settings > Encryption) — no env-var/file-based way to do that automatically, same
      # class of gotcha as admin_passwd elsewhere in this hub.
      - "443:443/tcp"
      - "443:443/udp"
      - "853:853/tcp"
      - "853:853/udp"
      - "784:784/udp"
      - "8853:8853/udp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No HEALTHCHECK: upstream removed theirs in v0.107.34 (caused restart loops), no
    # replacement exists.
    # No cap_drop: needs NET_BIND_SERVICE + DAC_OVERRIDE at startup, same as upstream's own
    # docker run example.
    security_opt:
      - no-new-privileges:true

volumes:
  adguard_work:
  adguard_conf:
