# Upstream's install.sh adds `build: ../../` next to `image:` — omitted on purpose,
# `image:` alone pulls the same published tag.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reportcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-reportcreator}
      PGDATA: /data
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportcreator}"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Please set REDIS_PASSWORD in .env file}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: syslifters/sysreptor:2026.55
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: ./.env
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-reportcreator}
      DATABASE_USER: ${POSTGRES_USER:-reportcreator}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      DATABASE_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:?Please set REDIS_PASSWORD in .env file}@redis:6379/0
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/public/utils/healthcheck/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
  app-data:
