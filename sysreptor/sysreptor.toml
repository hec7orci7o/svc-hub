[[stack]]
name = "sysreptor"
description = "SysReptor — pentest reporting platform (syslifters/sysreptor image)"
tags = ["sysreptor", "security"]

[stack.config]
server = "lab58"
links = ["https://sysreptor.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "sysreptor"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
POSTGRES_USER=reportcreator
POSTGRES_DB=reportcreator
POSTGRES_PASSWORD=[[SYSREPTOR_POSTGRES_PASSWORD]]
REDIS_PASSWORD=[[SYSREPTOR_REDIS_PASSWORD]]
SECRET_KEY=[[SYSREPTOR_SECRET_KEY]]
DEBUG=off

# Behind Traefik (TLS terminated at the entrypoint, plain HTTP to this container).
ALLOWED_HOSTS=sysreptor.[[TRAEFIK_DOMAIN]]
USE_X_FORWARDED_HOST=on
USE_X_FORWARDED_PORT=on
SECURE_SSL_REDIRECT=on
"""
