[[stack]]
name = "minecraft"
description = "Minecraft Java Edition server (official itzg/minecraft-server image)"
tags = ["minecraft"]

[stack.config]
server = "lab54"
linked_repo = "hec7orci7o/svc-hub"
run_directory = "minecraft"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
TZ=Europe/Madrid

EULA=TRUE

TYPE=PURPUR
VERSION=LATEST

MEMORY=4G

MAX_PLAYERS=10
DIFFICULTY=normal
MOTD=A Minecraft Server

# All marked optional (trailing ?): with VERSION=LATEST, any of these can lag behind the
# newest MC release on Modrinth (already hit griefprevention, then essentialsx) — optional
# skips a plugin with a warning instead of failing the whole boot over one laggard.
MODRINTH_PROJECTS=essentialsx?,vaultunlocked?,griefprevention?,chunky?,auraskills?,healthbar?,silkspawners?,viaversion?,simple-voice-chat?,quickshop-hikari?,grimac?

ENABLE_RCON=true
RCON_PASSWORD=[[MINECRAFT_RCON_PASSWORD]]

# Single line: rcon-cmds-daemon.sh pipes this through `echo -e`, so a backslash-n
# separates commands — a real multi-line value here breaks Komodo's own environment-string
# parsing before it ever reaches the container. TOML's own multi-line string would turn a
# single backslash into a real newline too, hence the doubled backslash below.
RCON_CMDS_STARTUP=gamerule playersSleepingPercentage 50\\nchunky radius 2000\\nchunky start
"""
