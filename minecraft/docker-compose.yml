# mkdir -p data && sudo chown -R 1000:1000 data   before first deploy.
# Switching modpack/loader (e.g. Fabric->Forge): old world+mods in ./data aren't compatible —
# rm -rf data/* on the host first so itzg regenerates it clean.
# Non-root (user: 1000:1000) is unverified against itzg's entrypoint — if startup fails on a
# root-only step, drop `user:` below and add `cap_add: [CHOWN, SETUID, SETGID]` instead.

services:
  minecraft:
    image: itzg/minecraft-server:2026.7.2
    restart: unless-stopped
    stop_grace_period: 60s
    user: "1000:1000"
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"  # Simple Voice Chat
    env_file: ./.env
    # Set directly here, not in minecraft.toml's environment block: Komodo's own
    # environment-string parser only supports single-line values (confirmed: a literal
    # backslash survives corrupted, always doubled, through its templating pipeline), so a
    # real multi-line RCON_CMDS_STARTUP has to go through Compose's own YAML instead.
    environment:
      RCON_CMDS_STARTUP: |-
        gamerule playersSleepingPercentage 50
        chunky radius 2000
        chunky start
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s  # first boot: downloading the ~366-file modpack + world-gen + pregen kickoff, on a Pi
