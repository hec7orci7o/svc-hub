# mkdir -p data && sudo chown -R 1000:1000 data   before first deploy.
# Switching modpack/loader: rm -rf data/* first, old world+mods aren't compatible.
# If startup fails under non-root, drop `user:` below and add `cap_add: [CHOWN, SETUID, SETGID]` instead.

services:
  minecraft:
    image: itzg/minecraft-server:2026.8.2
    restart: unless-stopped
    stop_grace_period: 60s
    user: "1000:1000"
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"  # Simple Voice Chat
    env_file: ./.env
    # Set here, not in minecraft.toml: Komodo's environment-string parser only supports single-line values.
    environment:
      RCON_CMDS_STARTUP: |-
        gamerule playersSleepingPercentage 50
        chunky radius 2000
        chunky start
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s  # first boot: downloading the ~366-file modpack + world-gen + pregen kickoff, on a Pi
