# scanopy — network topology/documentation tool (ghcr.io/scanopy/scanopy images) on lab57.
# Deploy-only, same pattern as every other service in this hub — no build of our own.
# AGPL-3.0 for self-hosted use; see https://github.com/scanopy/scanopy for the commercial
# license alternative if AGPL's source-disclosure requirement doesn't fit your use case.
# Copy .env.example to .env and fill it in before:
#   mkdir -p data
#   docker compose up -d

services:
  daemon:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    # Pre-1.0 (0.x): minor bumps aren't guaranteed backwards-compatible under semver —
    # see the packageRule in renovate.json that keeps these off automerge.
    image: ghcr.io/scanopy/scanopy/daemon:v0.17.4
    restart: unless-stopped
    # Host networking is required, not incidental: LAN topology discovery relies on
    # probing the real network segment, which doesn't work from a bridge network — same
    # reasoning as cups. docker.sock (ro) is for introspecting this host's own containers.
    # Full host access by design; no-new-privileges is still kept on top.
    network_mode: host
    privileged: true
    env_file: ./.env
    environment:
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - daemon-config:/root/.config/scanopy/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  postgres:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanopy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No cap_drop here: same startup chown/setuid exception as Mongo/Postgres elsewhere
    # in this hub (komodo/core, odoo/) — official entrypoint needs it to init the data dir.
    security_opt:
      - no-new-privileges:true

  server:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    # Pre-1.0 (0.x): see the note on the daemon image above.
    image: ghcr.io/scanopy/scanopy/server:v0.17.4
    restart: unless-stopped
    ports:
      - "60072:60072"
    env_file: ./.env
    environment:
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}@postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      daemon:
        condition: service_started
    networks:
      - scanopy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  daemon-config:

networks:
  scanopy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
