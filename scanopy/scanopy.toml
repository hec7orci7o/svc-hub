[[stack]]
name = "scanopy"
description = "scanopy — network topology documentation (ghcr.io/scanopy images + Postgres)"
tags = ["scanopy"]

[stack.config]
server = "lab53"
links = ["https://scanopy.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "scanopy"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
SCANOPY_LOG_LEVEL=info
POSTGRES_PASSWORD=[[SCANOPY_POSTGRES_PASSWORD]]
SCANOPY_PUBLIC_URL=https://scanopy.hectortoral.com
"""
