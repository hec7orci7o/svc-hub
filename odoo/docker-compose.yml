# Odoo (official image) + Postgres. Deploy-only, no build of our own.
# Copy .env.example to .env, mkdir -p addons, then docker compose up -d.
#
# No odoo.conf: admin_passwd/workers/memory limits have no env-var equivalent, and Komodo
# can't auto-write arbitrary config files — see CLAUDE.md. Runs on Odoo's own defaults
# (admin_passwd="admin", workers=0); change the master password at /web/database/manager
# after first boot.

services:
  db:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - odoo_network
    shm_size: 512mb
    # Tuned for 8GB — halve shared_buffers/effective_cache_size on a smaller board (no
    # mem_limit caps this, see "No resource limits" in CLAUDE.md).
    command: postgres -c shared_buffers=512MB -c effective_cache_size=2GB -c work_mem=16MB -c maintenance_work_mem=128MB -c max_connections=40 -c autovacuum=on
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No cap_drop: entrypoint needs root to init the data dir, same as Mongo's.
    security_opt:
      - no-new-privileges:true

  odoo:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - odoo_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db_data:
  odoo_data:

networks:
  odoo_network:
