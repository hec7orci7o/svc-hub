[[stack]]
name = "odoo"
description = "Odoo ERP + Postgres (official images)"
tags = ["odoo"]

[stack.config]
server = "lab57"
links = ["https://odoo.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "odoo"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
POSTGRES_DB=postgres
POSTGRES_USER=odoo
POSTGRES_PASSWORD=[[ODOO_POSTGRES_PASSWORD]]
"""
