# CUPS/AirPrint bridge (drpsychick/airprint-bridge image) on lab56, alongside n8n.
# Deploy-only, same pattern as every other service in this hub — no build of our own.
# Copy .env.example to .env and fill it in before:
#   docker compose up -d
# (docker compose loads ./.env automatically, both to interpolate ${VARS}
# here and to inject them into the container via env_file: ./.env)

services:
  cups:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    # Tags on this image are dated (focal-YYYYMMDD), not semver, so Renovate's
    # patch/minor automerge doesn't apply cleanly here — expect a PR for every new
    # date and review each one instead of trusting automerge.
    image: drpsychick/airprint-bridge:focal-20260706
    restart: unless-stopped
    # host networking is required, not incidental: AirPrint/Bonjour discovery relies on
    # mDNS broadcasts on the actual LAN segment, which don't traverse a bridge network.
    network_mode: host
    # Full host access by design (same exception class as Periphery's docker.sock mount):
    # needed for USB printer passthrough and Avahi/dbus integration with the host.
    # no-new-privileges/cap_drop are omitted deliberately, not skipped by oversight —
    # both are moot under privileged: true, which already grants every capability.
    privileged: true
    env_file: ./.env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - cups_config:/config
      - /var/run/dbus:/var/run/dbus
    devices:
      - /dev/bus/usb:/dev/bus/usb

volumes:
  cups_config:
