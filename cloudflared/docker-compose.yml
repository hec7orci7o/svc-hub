# NOT DEPLOYED YET, ON PURPOSE: a manual tunnel predates this hub and is still running.
# /deploy webhook stays unregistered until TUNNEL_TOKEN is migrated and the manual one retired.
#
# Every Public Hostname must target Traefik (lab53:443), never a backend origin directly.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.1
    restart: unless-stopped
    command: tunnel run
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
