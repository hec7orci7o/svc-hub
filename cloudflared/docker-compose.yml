# Cloudflare Tunnel: the hub's only public ingress (outbound-only, no router port-forwarding
# needed). Hostname routing lives in the Cloudflare Zero Trust dashboard, not here.
# Deploy-only. Copy .env.example to .env with the real tunnel token, then docker compose up -d.
#
# NOT DEPLOYED YET, ON PURPOSE: a manual tunnel (unpinned :latest) predating this hub is
# already running. This Stack's /deploy webhook is deliberately unregistered in GitHub —
# deploying without first migrating the real TUNNEL_TOKEN and retiring the manual one means
# two tunnels running at once.

services:
  cloudflared:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: cloudflare/cloudflared:2026.7.0
    restart: unless-stopped
    command: tunnel run
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
