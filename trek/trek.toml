[[stack]]
name = "trek"
description = "TREK — self-hosted collaborative travel planner (mauriceboe/trek image)"
tags = ["trek"]

[stack.config]
server = "lab56"
links = ["https://trek.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "trek"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
NODE_ENV=production
PORT=3000
ENCRYPTION_KEY=[[TREK_ENCRYPTION_KEY]]
TZ=Europe/Madrid
LOG_LEVEL=info
ALLOWED_ORIGINS=
APP_URL=https://trek.hectortoral.com
ADMIN_EMAIL=[[TREK_ADMIN_EMAIL]]
ADMIN_PASSWORD=[[TREK_ADMIN_PASSWORD]]
"""
