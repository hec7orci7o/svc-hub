[[stack]]
name = "wordpress"
description = "WordPress + MariaDB (official images) — ecommerce template"
tags = ["wordpress"]

[stack.config]
server = "lab57"
links = ["https://wordpress.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "wordpress"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
MARIADB_DATABASE=wordpress
MARIADB_USER=wordpress
MARIADB_PASSWORD=[[WORDPRESS_MARIADB_PASSWORD]]
MARIADB_ROOT_PASSWORD=[[WORDPRESS_MARIADB_ROOT_PASSWORD]]
"""
