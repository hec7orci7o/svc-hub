services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Please set MARIADB_PASSWORD in .env file}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Please set MARIADB_ROOT_PASSWORD in .env file}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - wordpress_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:7.0-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?Please set MARIADB_PASSWORD in .env file}
      # Traefik terminates TLS in front of this; without this WordPress thinks every request
      # is plain HTTP and redirect-loops / serves mixed content on the admin and checkout pages.
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/wp-login.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - wordpress_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # No cap_drop: apache's master process needs to stay root to setuid/setgid its workers
    # down to www-data and chown wp-content on first boot — not the Postgres/Mariadb case,
    # but the same root-at-startup shape.

volumes:
  db_data:
  wp_data:

networks:
  wordpress_network:
