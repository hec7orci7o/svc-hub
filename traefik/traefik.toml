[[stack]]
name = "traefik"
description = "Traefik — reverse proxy / TLS termination, certs via Let's Encrypt DNS-01 (Cloudflare)"
tags = ["traefik", "ingress"]

[stack.config]
server = "lab53"
linked_repo = "hec7orci7o/svc-hub"
run_directory = "traefik"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
CF_DNS_API_TOKEN=[[TRAEFIK_CF_DNS_API_TOKEN]]
ACME_EMAIL=[[TRAEFIK_ACME_EMAIL]]
DOMAIN=[[TRAEFIK_DOMAIN]]
LAN_CIDR=[[TRAEFIK_LAN_CIDR]]
N8N_BACKEND=[[TRAEFIK_N8N_BACKEND]]
SYSREPTOR_BACKEND=[[TRAEFIK_SYSREPTOR_BACKEND]]
BLOODHOUND_BACKEND=[[TRAEFIK_BLOODHOUND_BACKEND]]
ODOO_BACKEND=[[TRAEFIK_ODOO_BACKEND]]
TREK_BACKEND=[[TRAEFIK_TREK_BACKEND]]
SCANOPY_BACKEND=[[TRAEFIK_SCANOPY_BACKEND]]
ADGUARD_BACKEND=[[TRAEFIK_ADGUARD_BACKEND]]
KOMODO_BACKEND=[[TRAEFIK_KOMODO_BACKEND]]
WORDPRESS_BACKEND=[[TRAEFIK_WORDPRESS_BACKEND]]
HOME_ASSISTANT_BACKEND=[[TRAEFIK_HOME_ASSISTANT_BACKEND]]
INFISICAL_BACKEND=[[TRAEFIK_INFISICAL_BACKEND]]
"""
