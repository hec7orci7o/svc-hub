# Server definitions (schema: https://komo.do/docs/automate/sync-resources).
# Addresses use <name>.local (mDNS/Avahi) instead of raw LAN IPs, so this public repo
# never publishes real network details. Which services run where: grep `server =` across
# komodo/stacks/*.toml, not here.
#
# "lab53" is auto-created on Core's first boot (KOMODO_FIRST_SERVER_NAME in .env) — this
# block must stay in sync with that so ResourceSync doesn't detect a diff.

[[server]]
name = "lab53"
description = "Komodo Core + Periphery"
tags = ["core"]

[server.config]
address = "http://lab53.local:8120"
enabled = true

[[server]]
name = "lab54"
description = "Periphery (fleet)"
tags = ["fleet"]

[server.config]
address = "http://lab54.local:8120"
enabled = true

