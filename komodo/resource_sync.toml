# BOOTSTRAP NOTE: the first time, this ResourceSync must be created manually in
# the Komodo Core UI pointing at this repo (it can't self-create from a file it
# isn't reading yet). From then on, changes to servers.toml and stacks/*.toml
# are managed 100% via git.
# Verify the exact mechanism at komo.do/docs/automate/sync-resources.

[[resource_sync]]
name = "svc-hub-sync"

[resource_sync.config]
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
resource_path = ["komodo/servers.toml", "komodo/stacks"]
