# Schema: https://komo.do/docs/automate/sync-resources
# Deploy-only: redeploy triggers via this Stack's /deploy webhook, no CI involved.

[[stack]]
name = "cups"
description = "CUPS/AirPrint bridge (drpsychick/airprint-bridge image)"
tags = ["cups"]

[stack.config]
server = "lab56"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
run_directory = "cups"
file_paths = ["docker-compose.yml"]

environment = """
CUPS_ADMIN_USER=[[CUPS_ADMIN_USER]]
CUPS_ADMIN_PASSWORD=[[CUPS_ADMIN_PASSWORD]]

CUPS_WEBINTERFACE=yes
CUPS_SHARE_PRINTERS=yes
CUPS_REMOTE_ADMIN=yes

CUPS_ACCESS_LOGLEVEL=config
CUPS_LOGLEVEL=warn
CUPS_ENV_DEBUG=no

CUPS_IP=
CUPS_HOSTNAME=

CUPS_SSL_CERT=
CUPS_SSL_KEY=

AVAHI_INTERFACES=
AVAHI_IPV6=no
AVAHI_REFLECTOR=no
AVAHI_REFLECT_IPV=no

# Printer setup as code (not secret, no [[...]]). Brother DCP-1610W has no exact PPD; uses
# brlaser's DCP-1600 PPD (closest sibling). Try br1510.ppd if print quality looks off.
CUPS_LPADMIN_PRINTER1=lpadmin -p Brother_DCP-1610W_series -D 'Brother DCP-1610W series' -m drv:///brlaser.drv/br1600.ppd -v 'usb://Brother/DCP-1610W%20series?serial=E74230M8N868954' -o printer-is-shared=true
CUPS_LPADMIN_PRINTER1_ENABLE=cupsenable Brother_DCP-1610W_series
CUPS_LPADMIN_PRINTER1_ACCEPT=cupsaccept Brother_DCP-1610W_series
"""
