# Schema confirmed at https://komo.do/docs/automate/sync-resources
#
# Deploy-only, like every service in this hub: redeploy is triggered by a GitHub
# webhook pointed directly at this Stack's /deploy listener (copy the URL from
# the Komodo UI, Stack Config > Webhooks). No build, no GitHub Actions workflow involved.

[[stack]]
name = "cups"
description = "CUPS/AirPrint bridge (drpsychick/airprint-bridge image)"
tags = ["cups"]

[stack.config]
server = "lab56"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
# run_directory + relative file_paths so the .env this Stack writes lands in cups/, where
# env_file: ./.env expects it (see CLAUDE.md's "Secrets via Komodo Variables").
run_directory = "cups"
file_paths = ["docker-compose.yml"]

environment = """
CUPS_ADMIN_USER=[[CUPS_ADMIN_USER]]
CUPS_ADMIN_PASSWORD=[[CUPS_ADMIN_PASSWORD]]

CUPS_WEBINTERFACE=yes
CUPS_SHARE_PRINTERS=yes
CUPS_REMOTE_ADMIN=yes

CUPS_ACCESS_LOGLEVEL=config
CUPS_LOGLEVEL=warn
CUPS_ENV_DEBUG=no

CUPS_IP=
CUPS_HOSTNAME=

CUPS_SSL_CERT=
CUPS_SSL_KEY=

AVAHI_INTERFACES=
AVAHI_IPV6=no
AVAHI_REFLECTOR=no
AVAHI_REFLECT_IPV=no

# Printer setup as code (lpadmin one-liners the image runs at every startup) instead of
# the web UI, so a redeploy doesn't lose it — not secret, so plain values, no [[...]].
# Brother DCP-1610W (USB, serial E74230M8N868954): no exact PPD ships for it, so this uses
# brlaser's DCP-1600 PPD, the closest sibling (`lpinfo -m | grep -i brother`); try
# br1510.ppd instead if print quality/scaling looks off.
CUPS_LPADMIN_PRINTER1=lpadmin -p Brother_DCP-1610W_series -D 'Brother DCP-1610W series' -m drv:///brlaser.drv/br1600.ppd -v 'usb://Brother/DCP-1610W%20series?serial=E74230M8N868954' -o printer-is-shared=true
CUPS_LPADMIN_PRINTER1_ENABLE=cupsenable Brother_DCP-1610W_series
CUPS_LPADMIN_PRINTER1_ACCEPT=cupsaccept Brother_DCP-1610W_series
"""
