# Schema confirmed at https://komo.do/docs/automate/sync-resources
#
# Deploy-only, like every service in this hub: redeploy is triggered by a GitHub
# webhook pointed directly at this Stack's /deploy listener (copy the URL from
# the Komodo UI, Stack Config > Webhooks). No build, no GitHub Actions workflow involved.

[[stack]]
name = "odoo"
description = "Odoo ERP + Postgres (official images)"
tags = ["odoo"]

[stack.config]
server = "lab57"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
run_directory = "odoo"
file_paths = ["docker-compose.yml"]

# Tracks config/odoo.conf so it shows up editable in the Komodo UI (Stack > Config Files)
# and a change to it triggers a redeploy. This does NOT write/template the file the way
# `environment` below does for .env — config/odoo.conf must be created once (via that UI
# editor, or by hand on lab57) with a real admin_passwd; see odoo/odoo.conf.example and
# CLAUDE.md's "Secrets via Komodo Variables" for why this one file falls outside that
# pattern (the official Odoo image has no env-var equivalent for admin_passwd).
config_files = [
  { path = "config/odoo.conf", requires = "Redeploy" }
]

environment = """
POSTGRES_DB=postgres
POSTGRES_USER=odoo
POSTGRES_PASSWORD=[[ODOO_POSTGRES_PASSWORD]]
"""
