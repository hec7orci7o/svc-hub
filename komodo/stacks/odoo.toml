# Schema: https://komo.do/docs/automate/sync-resources
# Deploy-only: redeploy triggers via this Stack's /deploy webhook, no CI involved.

[[stack]]
name = "odoo"
description = "Odoo ERP + Postgres (official images)"
tags = ["odoo"]

[stack.config]
server = "lab57"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
run_directory = "odoo"
file_paths = ["docker-compose.yml"]

# No config_files/odoo.conf on purpose — see docker-compose.yml.
environment = """
POSTGRES_DB=postgres
POSTGRES_USER=odoo
POSTGRES_PASSWORD=[[ODOO_POSTGRES_PASSWORD]]
"""
