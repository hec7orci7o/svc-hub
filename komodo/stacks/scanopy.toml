# Schema confirmed at https://komo.do/docs/automate/sync-resources
#
# Deploy-only, like every service in this hub: redeploy is triggered by a GitHub
# webhook pointed directly at this Stack's /deploy listener (copy the URL from
# the Komodo UI, Stack Config > Webhooks). No build, no GitHub Actions workflow involved.

[[stack]]
name = "scanopy"
description = "scanopy — network topology documentation (ghcr.io/scanopy images + Postgres)"
tags = ["scanopy"]

[stack.config]
server = "lab57"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
file_paths = ["scanopy/docker-compose.yml"]
