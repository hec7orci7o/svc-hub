# Schema: https://komo.do/docs/automate/sync-resources
# Deploy-only: redeploy triggers via this Stack's /deploy webhook, no CI involved.

[[stack]]
name = "n8n"
description = "n8n (official docker.n8n.io/n8nio/n8n image)"
tags = ["n8n"]

[stack.config]
server = "lab56"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
run_directory = "n8n"
file_paths = ["docker-compose.yml"]

# Gotchas in CLAUDE.md's "Secrets via Komodo Variables". N8N_ENCRYPTION_KEY: generate once
# with `openssl rand -hex 32`, never change — breaks decryption of saved credentials.
environment = """
GENERIC_TIMEZONE=Europe/Madrid
TZ=Europe/Madrid

# Public via cloudflared; PROTOCOL stays http since cloudflared terminates TLS.
N8N_HOST=n8n.hectortoral.com
N8N_PORT=5678
N8N_PROTOCOL=http
WEBHOOK_URL=http://n8n.hectortoral.com/
N8N_SECURE_COOKIE=false

N8N_ENCRYPTION_KEY=[[N8N_ENCRYPTION_KEY]]

N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
N8N_RESTRICT_FILE_ACCESS_TO=/files

# n8n v2 blocks these by default; existing workflows depend on them.
N8N_BLOCK_ENV_ACCESS_IN_NODE=false
NODE_FUNCTION_ALLOW_EXTERNAL=cheerio

NODE_ENV=production

# PASSWORD_HASH: bcrypt, e.g. `docker run --rm httpd:alpine htpasswd -bnBC 10 "" 'pw'`.
# Single-quoted so the raw hash survives unescaped (see CLAUDE.md).
N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
N8N_INSTANCE_OWNER_EMAIL=[[N8N_INSTANCE_OWNER_EMAIL]]
N8N_INSTANCE_OWNER_FIRST_NAME=[[N8N_INSTANCE_OWNER_FIRST_NAME]]
N8N_INSTANCE_OWNER_LAST_NAME=[[N8N_INSTANCE_OWNER_LAST_NAME]]
N8N_INSTANCE_OWNER_PASSWORD_HASH='[[N8N_INSTANCE_OWNER_PASSWORD_HASH]]'
"""
