# Schema: https://komo.do/docs/automate/sync-resources
# Deploy-only: redeploy triggers via this Stack's /deploy webhook, no CI involved.

[[stack]]
name = "bloodhound-ce"
description = "BloodHound CE — Active Directory attack path analysis (specterops/bloodhound image)"
tags = ["bloodhound", "security"]

[stack.config]
server = "lab58"
git_provider = "github.com"
repo = "hec7orci7o/svc-hub"
branch = "main"
run_directory = "bloodhound-ce"
file_paths = ["docker-compose.yml"]

environment = """
POSTGRES_USER=bloodhound
POSTGRES_DB=bloodhound
POSTGRES_PASSWORD=[[BLOODHOUND_POSTGRES_PASSWORD]]
NEO4J_USER=neo4j
NEO4J_SECRET=[[BLOODHOUND_NEO4J_SECRET]]
"""
