# BloodHound CE — Active Directory attack path analysis (specterops/bloodhound image) on
# lab58, sharing the board with sysreptor. Deploy-only, same pattern as every other service
# in this hub — no build of our own.
# Copy .env.example to .env and fill it in before:
#   docker compose up -d

services:
  app-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER:-bloodhound}
      POSTGRES_USER: ${POSTGRES_USER:-bloodhound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-bloodhound}
    # Deliberately not published to the host — same DB-isolation pattern as odoo/scanopy's
    # Postgres. Only the bloodhound app service below is reachable over the LAN.
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloodhound} -d ${POSTGRES_DB:-bloodhound} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No cap_drop here: same startup chown/setuid exception as Mongo/Postgres elsewhere
    # in this hub — official entrypoint needs it to init the data dir.
    security_opt:
      - no-new-privileges:true

  graph-db:
    # Pinned to the 4.4 line on purpose: BloodHound CE's graph schema targets this Neo4j
    # major, not the newer 5.x line — don't bump this ahead of upstream's own compose.
    # See the renovate.json packageRule keeping minor bumps here off automerge.
    image: neo4j:4.4.42
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_SECRET:?Please set NEO4J_SECRET in .env file}
      NEO4J_dbms_allow__upgrade: "true"
    # Deliberately not published to the host, same reasoning as app-db — the Neo4j browser
    # is a second attack surface on top of the BloodHound UI itself. Only open this up
    # manually, and only after changing NEO4J_SECRET, per upstream's own warning.
    volumes:
      - graph-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No cap_drop here: same startup chown/setuid exception as the Postgres services above.
    security_opt:
      - no-new-privileges:true

  bloodhound:
    # Pinned literal tag (not an env var) so Renovate can see and bump it directly.
    image: specterops/bloodhound:9.4.0
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      bhe_database_connection: user=${POSTGRES_USER:-bloodhound} password=${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file} dbname=${POSTGRES_DB:-bloodhound} host=app-db
      bhe_neo4j_connection: neo4j://${NEO4J_USER:-neo4j}:${NEO4J_SECRET:?Please set NEO4J_SECRET in .env file}@graph-db:7687/
      bhe_graph_driver: neo4j
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app-db-data:
  graph-db-data:
