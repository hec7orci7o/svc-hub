[[stack]]
name = "bloodhound-ce"
description = "BloodHound CE — Active Directory attack path analysis (specterops/bloodhound image)"
tags = ["bloodhound", "security"]

[stack.config]
server = "lab58"
links = ["bloodhound.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "bloodhound-ce"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
POSTGRES_USER=bloodhound
POSTGRES_DB=bloodhound
POSTGRES_PASSWORD=[[BLOODHOUND_POSTGRES_PASSWORD]]
NEO4J_USER=neo4j
NEO4J_SECRET=[[BLOODHOUND_NEO4J_SECRET]]
"""
