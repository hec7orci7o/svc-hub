[[stack]]
name = "opengym"
description = "openGym — self-hosted gym/workout tracker (registry.gitlab.com/duartesantos8/opengym images)"
tags = ["opengym"]

[stack.config]
server = "lab56"
links = ["https://opengym.hectortoral.com"]
linked_repo = "hec7orci7o/svc-hub"
run_directory = "opengym"
file_paths = ["docker-compose.yml"]
registry_provider = "docker.io"
registry_account = "hec7or"

environment = """
RP_ID=opengym.hectortoral.com
ORIGIN=https://opengym.hectortoral.com
WEB_PORT=8080
RP_NAME=openGym
"""
